applicability: direct
practical_application: Considerar sede, duração, condições ambientais, taxa individual de suor e oportunidades de abastecimento; testar a estratégia em treino.
limitations:
  - Necessidades são individuais e mudam com ambiente e ritmo.
  - Condições clínicas e ambientes extremos exigem orientação profissional.
