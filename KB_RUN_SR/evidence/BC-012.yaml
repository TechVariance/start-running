id: BC-012
title: Risco de hidratação excessiva em endurance
claim: Hiponatremia associada ao exercício está frequentemente ligada à ingestão de líquido superior às perdas, sobretudo em esforços longos; beber o máximo possível não é orientação segura.
distances: [21K, 42K, general]
profiles: [recreational, trained, elite]
topics: [hydration, hyponatremia, race_safety]
