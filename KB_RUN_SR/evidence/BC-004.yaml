evidence_level: A
confidence: high
applicability: direct
practical_application: Integrar força progressiva ao ciclo, compatibilizando-a com sessões-chave e capacidade técnica do corredor.
limitations:
  - A confiança é maior para economia do que para prevenção de lesões.
  - Exercícios e cargas não devem ser copiados sem avaliação técnica.
