id: BC-015
title: Cadência e passada sem número universal
claim: Aumentar cadência pode reduzir algumas cargas biomecânicas, mas não há cadência universal e o efeito sobre lesão e desempenho depende do corredor.
distances: [5K, 10K, 21K, 42K, general]
profiles: [recreational, trained, return_to_run]
topics: [cadence, biomechanics, gait_retraining]
outcomes: [joint_load, technique, injury]
evidence_level: A
confidence: moderate
applicability: partial
practical_application: Considerar reeducação somente com objetivo definido, mudança gradual e monitoramento de sintomas e desempenho.
limitations:
  - Evidência é mais forte para alterações biomecânicas agudas do que para prevenção de lesão.
  - Mudanças podem redistribuir carga para outros tecidos.
