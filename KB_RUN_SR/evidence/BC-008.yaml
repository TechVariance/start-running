id: BC-008
title: Wearables como apoio e não como decisão clínica
claim: Feedback de wearables pode ajudar técnica, controle de velocidade e motivação, mas métricas proprietárias não substituem contexto, percepção ou avaliação profissional.
distances: [5K, 10K, 21K, 42K, general]
profiles: [recreational, trained]
