applicability: partial
practical_application: Guardar dados brutos e contexto; tratar VO2max estimado, readiness e carga proprietária como estimativas, não diagnósticos.
limitations:
  - Efeito depende do dispositivo, algoritmo e desfecho.
  - Evidência para redução de lesão permanece limitada.
