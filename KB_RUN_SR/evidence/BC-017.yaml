id: BC-017
title: Baixa disponibilidade energética e risco sistêmico
claim: Ingestão energética persistentemente incompatível com a carga pode prejudicar saúde óssea, endócrina, reprodutiva, imune e desempenho em pessoas de diferentes sexos.
distances: [5K, 10K, 21K, 42K, general]
