confidence: high
applicability: direct
practical_application: Não associar melhora de desempenho a restrição ou perda de peso; diante de sinais de risco, orientar avaliação multidisciplinar.
limitations:
  - Estimativas de disponibilidade energética em campo são imprecisas.
  - Ferramentas de triagem não substituem diagnóstico profissional.
