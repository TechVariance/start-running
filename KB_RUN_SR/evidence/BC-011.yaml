id: BC-011
title: Carboidrato em esforços prolongados
claim: A disponibilidade de carboidrato influencia a capacidade de sustentar exercício intenso e prolongado; ingestão durante esforços longos pode melhorar desempenho quando individualizada e tolerada.
distances: [10K, 21K, 42K, general]
profiles: [recreational, trained, elite]
topics: [nutrition, carbohydrate, race_strategy]
outcomes: [performance, gastrointestinal_tolerance, energy_availability]
evidence_level: A
confidence: high
applicability: direct
practical_application: Para esforços suficientemente longos, testar antecipadamente produto, dose, concentração, timing e líquidos; não estrear estratégia na prova.
limitations:
  - Necessidade varia com duração, intensidade e estoque energético.
  - Tolerância gastrointestinal limita a transferência de médias populacionais.
source_ids: [SRC-0015]
status: active
