id: BC-010
title: Sono como componente central da recuperação
claim: Sono insuficiente pode comprometer recuperação e atletas podem precisar de mais sono conforme carga e déficit acumulado; extensão e cochilos são estratégias promissoras.
distances: [5K, 10K, 21K, 42K, general]
profiles: [recreational, trained, elite, masters]
topics: [sleep, recovery, monitoring]
outcomes: [recovery, cognition, performance]
evidence_level: A
confidence: moderate
applicability: direct
practical_application: Monitorar regularidade, duração, qualidade percebida e sonolência; ajustar carga diante de déficit persistente. O público é amador, com rotina de trabalho e família que limita o controle do sono, então tratar a informação como insumo para adaptar o planejamento à realidade da pessoa. Apresentar higiene do sono e os fatores que afetam a qualidade (rotina, nutrição, álcool) sem transformar o déficit em cobrança.
limitations:
  - Necessidade individual varia.
  - A qualidade dos estudos de intervenção é desigual.
  - Reforçar repetidamente o déficit de sono para quem já vive sob rotina extenuante tende a afastar o usuário; a orientação informa e ajusta a sessão, não cobra.
source_ids: [SRC-0019]
status: active
last_reviewed: 2026-08-20
