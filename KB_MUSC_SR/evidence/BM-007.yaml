id: BM-007
title: Falha muscular não obrigatória
claim: Treinar até falha momentânea não é superior de forma consistente para hipertrofia e aumenta fadiga aguda.
goals: [strength, hypertrophy, power, running_support]
profiles: [beginner, recreational, trained]
topics: [failure, effort, fatigue]
outcomes: [muscle_mass, strength, fatigue]
evidence_level: A
confidence: high
applicability: direct
practical_application: Manter repetições em reserva ao longo de todo o programa. Para o público deste app, que treina força como suporte à corrida e em geral sem supervisão presencial, não propor treino até a falha, nem como recurso contextual.
limitations:
  - A distância ótima da falha ainda é difícil de medir.
  - A ressalva contra o uso contextual é uma decisão de escopo do produto, apoiada no perfil do usuário e na ausência de supervisão, não uma conclusão das fontes citadas.
