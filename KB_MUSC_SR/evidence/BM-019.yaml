id: BM-019
title: Sono e desempenho de força
claim: Perda de sono pode reduzir algumas medidas de força, potência e resistência muscular, embora a resposta varie entre tarefas e indivíduos.
goals: [health, strength, hypertrophy, power, function]
profiles: [recreational, trained, athlete]
topics: [sleep, recovery]
outcomes: [strength, power, fatigue]
evidence_level: A
confidence: moderate
applicability: direct
practical_application: Diante de sono ruim, ficar no aviso, priorizando técnica e ajustando carga ou volume em vez de buscar recordes. A variação entre indivíduos é grande demais para justificar conduta mais prescritiva do que isso.
limitations:
  - Número de estudos e amostras ainda é limitado.
  - A resposta individual varia muito, o que desaconselha transformar o achado em regra de ajuste automático de carga.
source_ids: [SRC-M-0018]
