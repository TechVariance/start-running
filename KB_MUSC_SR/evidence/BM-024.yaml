id: BM-024
title: Restrição de fluxo sanguíneo sob supervisão
claim: BFR com cargas baixas pode gerar adaptações, mas aplicação e segurança dependem de pressão, manguito, triagem e supervisão; não é método autônomo padrão.
goals: [strength, hypertrophy, function]
profiles: [adult, clinical_context]
topics: [blood_flow_restriction, safety]
outcomes: [strength, power, safety]
evidence_level: A
confidence: moderate
applicability: partial
practical_application: Reservar BFR para contexto supervisionado por profissional competente. O registro existe para responder com segurança a quem pergunta, não para o app propor o método: BFR está fora do escopo de uso deste produto e nunca deve ser sugerido de forma ativa.
limitations:
  - Protocolos, pressões e populações são heterogêneos.
  - Método fora do universo de aplicação deste app, que atende corredores amadores treinando sem supervisão presencial.
source_ids: [SRC-M-0025, SRC-M-0026]
status: active
last_reviewed: 2026-08-20
review_due: 2027-01-18
