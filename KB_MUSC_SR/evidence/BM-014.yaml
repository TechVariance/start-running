id: BM-014
title: Autoregulação do treinamento
claim: APRE, RPE, RIR e velocidade podem ajustar o treino ao estado do praticante, mas dependem de aprendizagem e medição consistente.
goals: [strength, hypertrophy, power]
profiles: [recreational, trained, athlete]
topics: [autoregulation, monitoring]
outcomes: [strength, fatigue_management, adherence]
evidence_level: A
confidence: moderate
applicability: direct
practical_application: Combinar meta planejada com resposta real da sessão e manter registros consistentes. O uso mais defensável para o iniciante não é pedir que ele autoregule dentro da sessão, e sim acumular os registros e usar o cruzamento deles para planejar as sessões seguintes.
limitations:
  - Comparações entre métodos são heterogêneas.
  - A qualidade da autoregulação depende fortemente da experiência do praticante, o que limita o método justamente em quem mais precisaria de ajuste.
source_ids: [SRC-M-0014]
status: active
last_reviewed: 2026-08-20
review_due: 2027-01-18
