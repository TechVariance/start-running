id: BM-021
title: Benefícios em adultos mais velhos
claim: Adultos mais velhos podem melhorar força, função e massa muscular com treinamento resistido adaptado à capacidade e ao estado de saúde.
goals: [health, strength, hypertrophy, function]
profiles: [older_adult, sarcopenia]
topics: [aging, function, strength, equipment]
outcomes: [strength, physical_function, muscle_mass]
evidence_level: A
confidence: high
applicability: direct
practical_application: Individualizar técnica, equilíbrio, carga e supervisão sem excluir estímulo desafiador somente pela idade. Neste público a preferência por máquinas costuma fazer mais sentido. Ações com velocidade na fase concêntrica são importantes para velocidade e ativação neuromuscular, mas a orientação precisa ser reescrita de forma inequívoca para essa faixa, em vez de repetir a fórmula de máxima intenção de velocidade.
limitations:
  - Condições clínicas e fragilidade alteram aplicabilidade.
  - A expressão máxima intenção de velocidade é ambígua para este público e não deve ser usada sem reformulação.
source_ids: [SRC-M-0020, SRC-M-0021]
status: active
last_reviewed: 2026-08-20
review_due: 2027-01-18
