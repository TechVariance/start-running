id: BM-015
title: Técnicas avançadas como opções não obrigatórias
claim: Drop sets, rest-pause, supersets e outras técnicas podem economizar tempo ou variar estímulo, sem superioridade universal.
goals: [strength, hypertrophy]
profiles: [trained]
topics: [advanced_methods, time_efficiency]
outcomes: [strength, muscle_mass, session_duration]
evidence_level: A
confidence: moderate
applicability: partial
practical_application: Priorizar técnica, progressão, volume recuperável e adesão antes de adicionar complexidade. Reservar essas técnicas a quem já tem experiência de treino de força.
limitations:
  - Protocolos e equiparação de volume variam.
  - São técnicas próprias de programas voltados à hipertrofia e têm pouco lugar em um programa de força como suporte à corrida.
