id: BM-010
title: Eficácia de máquinas e pesos livres
claim: Máquinas e pesos livres podem produzir força e hipertrofia; cada modalidade melhora mais testes semelhantes ao treinamento.
goals: [health, strength, hypertrophy, function]
profiles: [beginner, recreational, trained, older_adult]
topics: [equipment, specificity]
outcomes: [strength, muscle_mass, adherence]
evidence_level: A
confidence: high
applicability: direct
practical_application: Escolher por objetivo, preferência, acesso, estabilidade, habilidade e segurança. Para quem tem pouca experiência em treino de força, preferir máquinas e prever evolução para pesos livres conforme a experiência aumenta, pela solicitação da musculatura sinergista e pela maior transferência ao movimento. Um programa que combina os dois tipos é a conduta usual.
limitations:
  - Há menos estudos de hipertrofia que de força.
source_ids: [SRC-M-0012]
