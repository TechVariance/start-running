id: BM-023
title: Treinamento resistido supervisionado para jovens
claim: Crianças e adolescentes podem ganhar força com baixa taxa de eventos adversos quando o programa é adequado ao desenvolvimento, supervisionado e orientado por técnica.
goals: [health, strength, function]
profiles: [youth, adolescent]
topics: [youth_training, supervision, safety]
outcomes: [strength, physical_literacy, safety]
evidence_level: A
confidence: high
applicability: direct
practical_application: Fornecer educação geral e exigir responsável e profissional qualificado para programas individualizados ou testes máximos. Quando o tema aparecer, deixar claro que volume e intensidade precisam começar baixos e que o foco inicial é técnica.
limitations:
  - Maturidade, equipamento e qualidade da supervisão modificam segurança.
